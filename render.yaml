# Render Blueprint — provisions a Postgres DB + the FastAPI web service.
# In Render: New + -> Blueprint -> pick this repo. Then set CORS_ORIGINS
# to your Vercel URL once the frontend is deployed.
databases:
  - name: assetflow-db
    databaseName: assetflow
    user: assetflow
    plan: free

services:
  - type: web
    name: assetflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assetflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        sync: false   # set manually to your Vercel URL, e.g. https://assetflow.vercel.app
